name: Clang-Format

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'Aetherion/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/clang_format.yml'
      - '**/.clang-format'
      - '.run-clang-format'
  schedule:
    - cron: '0 5 * * *' # Runs every day at 5:00 AM

# A newer push to the same branch or PR cancels this run: the account runs at
# most 20 jobs at a time, and superseded runs used to hold those slots for
# hours. Runs on main are never cancelled, so every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  clang_format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run clang format
        run: |
          sudo apt update
          sudo apt install -y git clang-format-18
          bash .run-clang-format
          # Any change means a file is not formatted: show it and fail. Fix locally with `bash .run-clang-format`.
          git diff --exit-code
