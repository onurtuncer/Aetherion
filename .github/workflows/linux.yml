name: GCC Release Build

on:
  push:
    branches: [ main ]
    paths-ignore: ['README.md']
  pull_request:

# A newer push to the same branch or PR cancels this run: the account runs at
# most 20 jobs at a time, and superseded runs used to hold those slots for
# hours. Runs on main are never cancelled, so every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache vcpkg dependencies
        uses: ./.github/actions/vcpkg-cache

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y gcc-13 g++-13 libtbb-dev unzip

      - name: Configure compiler alternatives
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      # The production-FMU test (f16plant_fmpy_rollback: trim, rollback, turbulent and serialized rollback, nonzero
      # start time) runs under FMPy; AETHERION_REQUIRE_FMPY makes configure fail rather than leave it out.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install FMPy
        run: python -m pip install fmpy numpy

      - name: Configure (GCC Release)
        run: cmake --preset=gcc-release -DAETHERION_REQUIRE_FMPY=ON -DPython3_EXECUTABLE="$(which python)"

      - name: Build
        run: cmake --build --preset=gcc-release

      - name: Run tests
        run: ctest --preset=gcc-release -j "$(nproc)"

  # The installed SDK, consumed on its own (pre-DOI audit F07): configure with
  # install rules and without tests (so also without the ecos submodule, R01),
  # install, move the installation, then build and run tests/InstallConsumer
  # against the moved prefix only.
  install-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache vcpkg dependencies
        uses: ./.github/actions/vcpkg-cache

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y gcc-13 g++-13 unzip

      - name: Configure compiler alternatives
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

      - name: Configure (install rules, no tests, no submodules)
        run: >
          cmake --preset=gcc-release -B build/install-check
          -DAETHERION_INSTALL=ON -DAETHERION_BUILD_TESTS=OFF -DAETHERION_BUILD_EXAMPLES=OFF
          -DAETHERION_BUILD_FMUS=OFF -DAETHERION_BUILD_SIMULATION=OFF
          -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/aetherion-install

      - name: Build and install
        run: |
          cmake --build build/install-check
          cmake --install build/install-check

      - name: Relocate the installation
        run: mv "${{ runner.temp }}/aetherion-install" "${{ runner.temp }}/aetherion-moved"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install FMPy
        run: python -m pip install fmpy

      # Also builds ConsumerAtmosphere.fmu with generateFMU() from the installation alone, then loads and steps it
      # under FMPy (second pre-DOI audit, N05).
      - name: Build and run the consumer against the moved installation
        run: |
          cmake -S tests/InstallConsumer -B "${{ runner.temp }}/consumer" -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_PREFIX_PATH="${{ runner.temp }}/aetherion-moved"
          cmake --build "${{ runner.temp }}/consumer"
          "${{ runner.temp }}/consumer/aetherion_consumer"
          python tests/InstallConsumer/check_fmu.py "${{ runner.temp }}/consumer/models/fmi2/ConsumerAtmosphere.fmu"
