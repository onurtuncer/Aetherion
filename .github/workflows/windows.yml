name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:

# A newer push to the same branch or PR cancels this run: the account runs at
# most 20 jobs at a time, and superseded runs used to hold those slots for
# hours. Runs on main are never cancelled, so every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-static-library:
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache vcpkg dependencies
        uses: ./.github/actions/vcpkg-cache

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure 
        run: cmake --preset release 

      - name: Build
        run: cmake --build --preset release

      - name: Run tests
        run: ctest --preset release
