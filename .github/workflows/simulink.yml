name: Simulink F16 Autopilot

on:
  workflow_run:
    workflows: ["Windows Build"]
    types: [completed]

jobs:
  # ── Job 1: build both FMUs (Windows/MSVC, same toolchain as windows.yml) ──
  build-fmus:
    name: Build F16 FMUs
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure (release + FMUs)
        run: cmake --preset release -DAETHERION_BUILD_FMUS=ON

      - name: Build F16Plant FMU
        run: cmake --build --preset release --target F16Plant_fmi2

      - name: Build F16Autopilot FMU
        run: cmake --build --preset release --target F16Autopilot_fmi2

      - name: Upload FMUs
        uses: actions/upload-artifact@v4
        with:
          name: f16-fmus
          retention-days: 7
          path: |
            out/build/windows-release/models/fmi2/F16Plant/F16Plant.fmu
            out/build/windows-release/models/fmi2/F16Autopilot/F16Autopilot.fmu

  # ── Job 2: build the Simulink model and run closed-loop simulation ──
  simulate:
    name: Simulink F16 Autopilot Simulation
    runs-on: windows-latest
    needs: build-fmus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download F16 FMUs
        uses: actions/download-artifact@v4
        with:
          name: f16-fmus
          path: matlab

      - name: Download FMI Kit for Simulink
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/CATIA-Systems/FMIKit-Simulink/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'No zip asset found in latest FMI Kit release.' }
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile FMIKit.zip
          Expand-Archive -Path FMIKit.zip -DestinationPath FMIKit-Simulink -Force
          Write-Host "FMI Kit downloaded: $($asset.name)"

      - name: Set up MATLAB with Simulink
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023a
          products: Simulink

      - name: Allow Java AWT (FMIKit's block dialogs need non-headless Swing)
        shell: pwsh
        run: Set-Content -Path java.opts -Value '-Djava.awt.headless=false' -Encoding ascii

      # matlab-actions/run-command always starts MATLAB with -batch, which does
      # not read java.opts (needed to keep FMIKit's block-configuration dialogs
      # from throwing java.awt.HeadlessException) and cannot be overridden via
      # that action's inputs. Invoke MATLAB directly in -r mode instead, which
      # does read startup files.
      - name: Build F16 Autopilot model and simulate
        shell: pwsh
        run: |
          $mScript = "try; run('matlab/build_f16_simulink.m'); catch e; disp(getReport(e)); exit(1); end; exit(0);"
          matlab -nosplash -nodesktop -wait -logfile matlab_build.log -r $mScript
          $exitCode = $LASTEXITCODE
          if (Test-Path matlab_build.log) { Get-Content matlab_build.log }
          if ($exitCode -ne 0) { throw "MATLAB build/simulate failed with exit code $exitCode" }

      - name: Upload Simulink model and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f16-simulink-results
          path: |
            matlab/F16_Autopilot.slx
            matlab/results/
