name: Simulink F16 Autopilot

on:
  workflow_run:
    workflows: ["Windows Build"]
    types: [completed]
  workflow_dispatch:

jobs:
  # ── Job 1: build both FMUs (Windows/MSVC, same toolchain as windows.yml) ──
  build-fmus:
    name: Build F16 FMUs
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache vcpkg dependencies
        uses: ./.github/actions/vcpkg-cache

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure (release + FMUs)
        run: cmake --preset release -DAETHERION_BUILD_FMUS=ON

      - name: Build F16Plant FMU
        run: cmake --build --preset release --target F16Plant_fmi2

      - name: Build F16Autopilot FMU
        run: cmake --build --preset release --target F16Autopilot_fmi2

      - name: Upload FMUs
        uses: actions/upload-artifact@v7
        with:
          name: f16-fmus
          retention-days: 7
          path: |
            out/build/windows-release/models/fmi2/F16Plant/F16Plant.fmu
            out/build/windows-release/models/fmi2/F16Autopilot/F16Autopilot.fmu

  # ── Job 2: build the Simulink model and run closed-loop simulation ──
  simulate:
    name: Simulink F16 Autopilot Simulation
    runs-on: windows-latest
    needs: build-fmus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download F16 FMUs
        uses: actions/download-artifact@v8
        with:
          name: f16-fmus
          path: matlab

      - name: Set up MATLAB with Simulink
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2023a
          products: Simulink

      # The model is built with Simulink's native FMU block (no FMIKit), so
      # the headless matlab-batch session used by run-command is fine. Do NOT
      # invoke `matlab` directly here: on GitHub-hosted runners the MATLAB
      # from setup-matlab is only licensed through the matlab-actions run
      # actions — a direct launch fails activation and exits immediately.
      - name: Build F16 Autopilot model and simulate
        uses: matlab-actions/run-command@v3
        with:
          command: run('matlab/build_f16_simulink.m')

      - name: Upload Simulink model and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: f16-simulink-results
          path: |
            matlab/F16_Autopilot.slx
            matlab/results/
