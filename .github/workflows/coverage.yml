name: Coverage

# Coverage runs on main only (and on demand). It builds Debug with coverage
# instrumentation and runs the whole suite, slow convergence tests included:
# 2-4 hours a run, holding a runner throughout. On pull requests that cost
# more than it told: the GCC, Windows and sanitizer jobs already gate
# correctness there, and the coverage figure that matters (the Codecov badge)
# is main's.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only the newest commit's coverage matters, so a newer push to main cancels a
# run still in progress instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Cache vcpkg dependencies
      uses: ./.github/actions/vcpkg-cache

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y lcov gcovr gcc-13 g++-13 libtbb-dev unzip

    - name: Configure compiler alternatives
      run: |
        sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-13 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100

    - name: Configure (GCC Debug + coverage flags)
      run: cmake --preset=gcc-debug

    - name: Build
      run: cmake --build --preset=gcc-debug

    - name: Run tests
      run: ctest --preset=gcc-test

    - name: Generate coverage report (Cobertura XML)
      if: ${{ !cancelled() }}
      run: |
        gcovr \
          --root . \
          --exclude 'tests/.*' \
          --exclude 'vendor/.*' \
          --exclude 'cmake/.*' \
          --exclude '.*/_deps/.*' \
          --exclude '.*CMakeFiles.*' \
          --exclude 'src/Examples/.*' \
          --gcov-executable gcov-13 \
          --gcov-ignore-errors=no_working_dir_found \
          --xml build/gcc-debug/coverage.xml \
          --xml-pretty \
          build/gcc-debug

    - name: Upload coverage to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: onurtuncer/Aetherion
        files: build/gcc-debug/coverage.xml
        fail_ci_if_error: false
        verbose: true
